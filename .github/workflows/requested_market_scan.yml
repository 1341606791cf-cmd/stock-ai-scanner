name: Requested real market scan and email
on:
  push:
    branches: [main]
    paths: ['.github/workflows/requested_market_scan.yml']
permissions:
  contents: read
jobs:
  real_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
      QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
      AI_BASE_URL: https://api.deepseek.com
      AI_MODEL: deepseek-flash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: stock-requirements.txt
      - run: python -m pip install -r stock-requirements.txt
      - name: Scan real completed daily bars and email requested report once
        shell: bash
        run: |
          python - <<'PY'
          import stock_ai_scanner as s
          from email_reports import render_email
          scanned, reports, failed = [], [], []
          for ticker in s.WATCHLIST:
              try:
                  df = s.yf.Ticker(ticker).history(period="3mo", interval="1d", auto_adjust=True, timeout=15)
                  df = s.completed_daily_bars(df)
                  if df.empty or len(df) < 30:
                      raise RuntimeError("Insufficient completed daily bars")
                  df = s.calculate_indicators(df)
                  score = s.score_stock(ticker, df)
                  scanned.append(score)
                  points = "/".join(str(p["score"]) for p in score["parts"])
                  print(f"[{ticker}] 日期 {score['date']} | 复权收盘 ${score['close']:.2f} | RSI {score['rsi']:.1f} | BOLL/RSI/MACD {points} | 总分 {score['total']}/100 | {score['tier']}", flush=True)
                  if score["eligible"]:
                      advice = s.ask_ai_analyst(ticker, df, score)
                      reports.append({**score, "advice": advice})
              except Exception as exc:
                  failed.append(ticker)
                  print(f"[{ticker}] 获取或研判失败：{type(exc).__name__}", flush=True)
          if not scanned:
              raise SystemExit("No real market data available; no email sent.")
          plain, formatted = render_email(reports, scanned)
          prefix = "按你的本次手动请求发送真实评分汇总。日常自动提醒仍仅在达到70分时发送。"
          plain = prefix + "\n\n" + "\n".join(f"{r['ticker']} | {r['date']} | 复权收盘 ${r['close']:.2f} | RSI {r['rsi']:.1f} | {r['total']}/100" for r in scanned) + "\n\n" + plain
          formatted = formatted.replace("仅汇总达到70分的技术信号", "手动请求 · 真实评分汇总，AI仅研判达到70分的标的")
          highest = max(r["total"] for r in scanned)
          subject = f"真实扫描 | {len(scanned)}只已评分 · {len(reports)}只完成AI研判 · 最高{highest}分"
          if failed:
              subject = "部分完成 | " + subject
              plain += "\n未完成：" + ", ".join(failed)
          s.send_qq_email(subject, plain, formatted)
          print(f"真实评分邮件已发送：已评分{len(scanned)}只，AI研判{len(reports)}只，最高{highest}分。", flush=True)
          if failed:
              raise SystemExit("Partial scan; incomplete symbols: " + ", ".join(failed))
          PY
