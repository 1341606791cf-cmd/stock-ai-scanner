name: Daily US stock AI scan

on:
  schedule:
    # 每天北京时间 06:30；GitHub cron 使用 UTC。无纽约当日收盘数据时不会发邮件。
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      test_email:
        description: '只发送一封 QQ 测试邮件'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
      QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
      AI_BASE_URL: https://api.openai.com/v1
      AI_MODEL: gpt-4o-mini
      TEST_EMAIL: ${{ inputs.test_email }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: stock-requirements.txt
      - run: python -m pip install -r stock-requirements.txt
      - name: Run scanner or test email
        shell: bash
        run: |
          if [[ "$TEST_EMAIL" == "true" ]]; then
            python stock_ai_scanner.py --test-email
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            python stock_ai_scanner.py --require-today
          else
            python stock_ai_scanner.py
          fi
