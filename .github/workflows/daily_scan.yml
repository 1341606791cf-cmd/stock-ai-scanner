name: Daily US stock AI scan

on:
  push:
    paths:
      - 'stock_ai_scanner.py'
      - 'email_reports.py'
      - 'stock-requirements.txt'
      - 'tests/**'
      - '.github/workflows/daily_scan.yml'
  schedule:
    # 北京时间周一至周五 06:30 = UTC 周日至周四 22:30。
    # 休市或日线未更新也发状态邮件，并标明最近数据日期，不重复调用 AI。
    - cron: '30 22 * * 0,1,2,3,4'
  workflow_dispatch:
    inputs:
      test_email:
        description: '只发送新版 HTML 版式测试邮件（虚构示例）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
      QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
      AI_BASE_URL: https://api.deepseek.com
      AI_MODEL: deepseek-flash
      TEST_EMAIL: ${{ inputs.test_email }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: stock-requirements.txt
      - run: python -m pip install -r stock-requirements.txt
      - name: Check scoring and email formatting
        run: python -m unittest discover -s tests -v
      - name: Run scanner or test email
        if: github.event_name != 'push'
        shell: bash
        run: |
          if [[ "$TEST_EMAIL" == "true" ]]; then
            python stock_ai_scanner.py --test-email
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            python stock_ai_scanner.py --require-today
          else
            python stock_ai_scanner.py
          fi
