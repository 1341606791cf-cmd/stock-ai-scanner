name: Local stock report data

on:
  push:
    paths:
      - 'stock_ai_scanner.py'
      - 'local_stock_report.py'
      - 'email_reports.py'
      - 'stock-requirements.txt'
      - 'tests/**'
      - '.github/workflows/daily_scan.yml'
  # Cloud updates public market data only. No QQ or AI calls.
  schedule:
    - cron: '30 22 * * 0,1,2,3,4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: local-stock-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: stock-requirements.txt
      - run: python -m pip install -r stock-requirements.txt
      - name: Verify scoring and local report
        run: python -m unittest discover -s tests -v
      - name: Download public market data and build report
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-report]')
        run: python local_stock_report.py --source yahoo --output reports/latest.html --data-output reports/latest-data.json --no-open
      - name: Publish market snapshot for local import
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-report]')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/latest-data.json reports/latest.html
          if ! git diff --cached --quiet; then
            git commit -m 'Update public market snapshot for local reports'
            git push origin HEAD:main
          fi

