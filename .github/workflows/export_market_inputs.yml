name: Export requested source market data
on:
  push:
    branches: [main]
    paths: ['.github/workflows/export_market_inputs.yml']
permissions:
  contents: read
jobs:
  export_data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: stock-requirements.txt
      - run: python -m pip install -r stock-requirements.txt
      - name: Export Yahoo OHLCV and exact current scanner inputs without sending email
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, zipfile
          from datetime import datetime, timezone
          from pathlib import Path
          import pandas as pd
          import stock_ai_scanner as s
          out=Path("market-inputs")
          out.mkdir()
          manifest={"purpose":"Fresh re-download for audit; NOT a preserved copy of the earlier run.",
                    "source":"Yahoo Finance via yfinance", "period":"3mo", "interval":"1d",
                    "generated_at_utc":datetime.now(timezone.utc).isoformat(),
                    "github_sha":os.getenv("GITHUB_SHA"), "dataframes_are":"Parsed yfinance tables, not raw HTTP response bytes.",
                    "files":[], "symbols":[]}
          scores=[]
          failures=[]
          for ticker in s.WATCHLIST:
              try:
                  fetched=datetime.now(timezone.utc).isoformat()
                  raw=s.yf.Ticker(ticker).history(period="3mo",interval="1d",auto_adjust=False,timeout=15)
                  adjusted=s.yf.Ticker(ticker).history(period="3mo",interval="1d",auto_adjust=True,timeout=15)
                  completed=s.completed_daily_bars(adjusted)
                  if raw.empty or len(completed)<30:
                      raise RuntimeError("Insufficient historical data")
                  indicators=s.calculate_indicators(completed)
                  score=s.score_stock(ticker,indicators)
                  scores.append(score)
                  datasets={"unadjusted":raw, "scanner_input_adjusted":completed, "indicators":indicators}
                  for kind,frame in datasets.items():
                      path=out/f"{ticker}_{kind}.csv"
                      frame.to_csv(path,index_label="Date",encoding="utf-8-sig",float_format="%.12g")
                      manifest["files"].append({"path":path.name,"sha256":hashlib.sha256(path.read_bytes()).hexdigest(),"rows":len(frame)})
                  manifest["symbols"].append({"ticker":ticker,"download_started_at_utc":fetched,
                      "first_input_date":str(completed.index[0]),"last_input_date":str(completed.index[-1]),
                      "raw_columns":list(raw.columns),"input_columns":list(completed.columns)})
                  recent=raw.tail(5).reset_index()
                  recent["Date"]=recent["Date"].astype(str)
                  print("AUDIT_RECENT "+json.dumps({"ticker":ticker,"unadjusted_last_5":recent.to_dict(orient="records"),"recomputed_score":score},ensure_ascii=False),flush=True)
              except Exception as exc:
                  failures.append({"ticker":ticker,"error_type":type(exc).__name__})
          manifest["failures"]=failures
          (out/"manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding="utf-8")
          (out/"recomputed_scores.json").write_text(json.dumps(scores,ensure_ascii=False,indent=2),encoding="utf-8")
          (out/"README.txt").write_text(
              "本次为新下载的核验数据，不能作为上次运行时未留存的原始快照。\n"
              "*_unadjusted.csv：yfinance auto_adjust=False返回的OHLCV和Adj Close等字段，可能含盘中当日行。\n"
              "*_scanner_input_adjusted.csv：auto_adjust=True并排除尚未收盘日线后的实际计算输入。\n"
              "*_indicators.csv：上述计算输入和BOLL、RSI、MACD。\n"
              "manifest.json记录UTC下载时间、窗口范围和CSV的SHA256。所有CSV均为解析后的行情表，不是HTTP原始报文。\n",
              encoding="utf-8")
          with zipfile.ZipFile("market-inputs.zip","w",zipfile.ZIP_DEFLATED) as z:
              for p in sorted(out.iterdir()):
                  z.write(p,p.name)
          print("AUDIT_ZIP_BASE64 "+base64.b64encode(Path("market-inputs.zip").read_bytes()).decode(),flush=True)
          print("AUDIT_MANIFEST "+json.dumps(manifest,ensure_ascii=False),flush=True)
          if failures:
              raise SystemExit("Partial export: "+str(failures))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-market-inputs
          path: market-inputs.zip
          retention-days: 7
