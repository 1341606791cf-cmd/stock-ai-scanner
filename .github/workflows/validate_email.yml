name: One-time HTML email delivery test
on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate_email.yml']
permissions:
  contents: read
jobs:
  email_test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
      QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: stock-requirements.txt
      - run: python -m pip install -r stock-requirements.txt
      - name: Validate scoring and email layout
        run: python -m unittest discover -s tests -v
      - name: Send one clearly marked HTML sample email
        run: python stock_ai_scanner.py --test-email
